<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101322">
<title>Werwolf Erzähler</title>
<style>
:root{--bg:#0b0e1c;--card:#171b31;--card2:#222844;--text:#fff;--muted:#aeb5d0;--pink:#ff4f6d;--violet:#7c5cff;--green:#35d58a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 0%,rgba(124,92,255,.28),transparent 35%),radial-gradient(circle at 100% 10%,rgba(255,79,109,.18),transparent 30%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
#app{max-width:620px;min-height:100vh;margin:auto;padding:18px 16px 32px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-size:20px;font-weight:900}.reset{width:44px;height:44px;border:0;border-radius:15px;background:rgba(255,255,255,.09);color:white;font-size:21px}
.hero{padding:26px 20px;border-radius:28px;background:linear-gradient(145deg,#242a49,#171a2e);box-shadow:0 18px 45px rgba(0,0,0,.3);margin-bottom:16px}
.eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:1.5px;color:#c9ceef;font-weight:900}
h1{font-size:36px;line-height:1;margin:8px 0 12px}h2{margin:0 0 6px;font-size:23px}
p{line-height:1.45}.muted{color:var(--muted)}
.card{background:rgba(23,27,49,.96);border:1px solid rgba(255,255,255,.07);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 15px 35px rgba(0,0,0,.2)}
.row{display:flex;gap:9px;margin:13px 0}.row input{flex:1;min-width:0;background:#0e1224;border:1px solid #343b5c;border-radius:15px;color:white;padding:14px;font-size:16px}.add{width:52px;border:0;border-radius:15px;background:var(--pink);color:white;font-size:24px}
.list{display:grid;gap:9px}.player{display:flex;align-items:center;justify-content:space-between;background:#101529;padding:13px 14px;border-radius:16px;font-weight:800}.x{border:0;background:none;color:#8d96b5;font-size:20px}
.btn{width:100%;border:0;border-radius:18px;padding:17px;color:white;font-size:18px;font-weight:900;margin-top:10px;background:var(--card2)}.primary{background:linear-gradient(135deg,var(--pink),#ff815c);box-shadow:0 10px 25px rgba(255,79,109,.22)}.next{background:linear-gradient(135deg,var(--violet),#a45cff)}button:disabled{opacity:.35}
.select{width:100%;background:#101529;color:white;border:1px solid #394160;border-radius:15px;padding:11px;font-size:14px}
.roleline{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#101529;padding:12px;border-radius:16px;margin:8px 0}.roleline strong{display:block}.pill{font-size:12px;color:#d8ddff;background:#2b3150;border-radius:9px;padding:5px 8px}
.progress{display:flex;gap:6px;margin-bottom:14px}.bar{height:7px;flex:1;background:#292f4b;border-radius:99px}.bar.on{background:linear-gradient(90deg,var(--pink),var(--violet))}
.phase{text-align:center;text-transform:uppercase;letter-spacing:1.4px;color:#b9c0df;font-weight:900;font-size:12px}.icon{text-align:center;font-size:58px;margin:8px}.question{text-align:center;font-size:28px;font-weight:950;line-height:1.08}.hint{text-align:center;color:var(--muted);margin:8px 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:2px solid transparent;background:#171d35;color:white;border-radius:19px;padding:17px 12px;text-align:left;min-height:70px;font-weight:850}.choice.selected{border-color:var(--pink);background:#2a2035}.choice small{display:block;color:#929bbb;margin-top:5px;font-weight:600}
.notice{background:#232943;border-radius:17px;padding:14px;color:#e2e5f6;margin:10px 0}
.morning{background:linear-gradient(145deg,#2a2348,#17263a)}.death{display:flex;justify-content:space-between;padding:13px 14px;background:#11162a;border-radius:15px;margin-top:8px}.empty{padding:12px 0}
@media(max-width:390px){h1{font-size:31px}.question{font-size:25px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

const ROLES={
 wolf:{name:"Werwolf",icon:"🐺"},
 seer:{name:"Seherin",icon:"🔮"},
 witch:{name:"Hexe",icon:"🧙"},
 cupid:{name:"Amor",icon:"💘"},
 hunter:{name:"Jäger",icon:"🏹"},
 villager:{name:"Dorfbewohner",icon:"👨‍🌾"},
 thief:{name:"Dieb",icon:"🃏"}
};

const KEY="werwolf-erzaehler-komplett-v1";

function fresh(){return{players:[],night:1,screen:"setup",phase:null,victim:null,seerTarget:null,poisonTarget:null,healUsed:false,poisonUsed:false,healDecision:null,poisonDecision:null,dayVote:null,lovers:[],hunterTarget:null,log:[]};}
let S=fresh();
try{const saved=localStorage.getItem(KEY);if(saved)S=Object.assign(fresh(),JSON.parse(saved));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function player(id){return S.players.find(p=>String(p.id)===String(id));}
function alive(){return S.players.filter(p=>p.alive);}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function header(){return '<div class="top"><div class="brand">🌙 Werwolf Erzähler</div><button class="reset" onclick="newGame()">↺</button></div>';}
function newGame(){if(confirm("Neues Spiel starten?")){S=fresh();save();render();}}
function render(){const app=document.getElementById("app");if(S.screen==="setup")renderSetup(app);else if(S.screen==="roles")renderRoles(app);else if(S.screen==="play")renderPlay(app);else renderMorning(app);}

function renderSetup(app){
app.innerHTML=header()+`
<section class="hero"><div class="eyebrow">Spielleiter-Modus</div><h1>Bereit für die Nacht?</h1><p class="muted">Spieler eintragen, Rollen verteilen und die Nacht Schritt für Schritt führen.</p></section>
<section class="card"><h2>👥 Spieler</h2><p class="muted">Mindestens 4 Spieler</p>
<div class="row"><input id="nameInput" maxlength="22" placeholder="Name eingeben"><button class="add" onclick="addPlayer()">+</button></div>
<div class="list">${S.players.map(p=>`<div class="player"><span>${esc(p.name)}</span><button class="x" onclick="removePlayer('${p.id}')">×</button></div>`).join("")}</div>
</section>
<button class="btn primary" onclick="goRoles()" ${S.players.length<4?"disabled":""}>🎭 Rollen verteilen</button>
<button class="btn" onclick="demo()">Demo mit 8 Spielern</button>`;
document.getElementById("nameInput").addEventListener("keydown",e=>{if(e.key==="Enter")addPlayer();});
}
function addPlayer(){const input=document.getElementById("nameInput"),name=input.value.trim();if(!name)return;S.players.push({id:Date.now()+"-"+Math.random(),name,role:null,alive:true});input.value="";save();render();}
function removePlayer(id){S.players=S.players.filter(p=>String(p.id)!==String(id));save();render();}
function demo(){const names=["Anna","Ben","Clara","David","Emma","Felix","Greta","Hannes"];S.players=names.map((name,i)=>({id:i+1,name,role:null,alive:true}));save();render();}
function goRoles(){S.screen="roles";save();render();}

function renderRoles(app){
app.innerHTML=header()+`
<section class="card"><h2>🎭 Rollen verteilen</h2><p class="muted">Die Rollen sieht nur der Erzähler.</p>
${S.players.map(p=>`<div class="roleline"><div><strong>${esc(p.name)}</strong><span class="pill">${p.role?ROLES[p.role].icon+" "+ROLES[p.role].name:"noch keine Rolle"}</span></div>
<select class="select" onchange="setRole('${p.id}',this.value)"><option value="">Rolle wählen</option>
${Object.keys(ROLES).map(r=>`<option value="${r}" ${p.role===r?"selected":""}>${ROLES[r].icon} ${ROLES[r].name}</option>`).join("")}
</select></div>`).join("")}</section>
<button class="btn primary" onclick="startGame()" ${S.players.some(p=>!p.role)?"disabled":""}>🌙 Nacht 1 starten</button>`;
}
function setRole(id,role){const p=player(id);if(p)p.role=role||null;save();render();}

function sequence(){
const q=[];
if(S.night===1&&S.players.some(p=>p.alive&&p.role==="thief"))q.push("thief");
if(S.night===1&&S.players.some(p=>p.alive&&p.role==="cupid"))q.push("cupid");
if(S.players.some(p=>p.alive&&p.role==="wolf"))q.push("wolf");
if(S.players.some(p=>p.alive&&p.role==="seer"))q.push("seer");
if(S.players.some(p=>p.alive&&p.role==="witch"))q.push("witch");
return q;
}
function startGame(){S.screen="play";S.phase=sequence()[0]||"wolf";save();render();}

function renderPlay(app){
const phases=S.phase==="hunter"?["hunter"]:sequence();const idx=Math.max(0,phases.indexOf(S.phase));const role=ROLES[S.phase]||ROLES.wolf;let body="";
if(S.phase==="thief")body=thiefStep();if(S.phase==="cupid")body=cupidStep();if(S.phase==="wolf")body=wolfStep();if(S.phase==="seer")body=seerStep();if(S.phase==="witch")body=witchStep();if(S.phase==="hunter")body=hunterStep();
app.innerHTML=header()+`<div class="progress">${phases.map((x,i)=>`<div class="bar ${i<=idx?"on":""}"></div>`).join("")}</div>
<div class="phase">Nacht ${S.night} · ${role.name}</div><div class="icon">${role.icon}</div><div class="question">${question(S.phase)}</div><div class="hint">${hint(S.phase)}</div>${body}`;
}
function question(p){return{thief:"Dieb",cupid:"Wer sind die Liebenden?",wolf:"Wen sollen die Werwölfe töten?",seer:"Wessen Rolle willst du sehen?",witch:"Was soll die Hexe tun?",hunter:"Wen nimmt der Jäger mit?"}[p];}
function hint(p){return{thief:"Hausregel prüfen und weiter.",cupid:"Genau zwei Spieler auswählen.",wolf:"Ein lebendes Opfer auswählen.",seer:"Die Rolle wird nur dir angezeigt.",witch:"Retten und Vergiften sind jeweils einmal möglich.",hunter:"Der Jäger nimmt einen lebenden Spieler mit."}[p];}
function nextButton(disabled){return `<button class="btn next" onclick="nextPhase()" ${disabled?"disabled":""}>Weiter →</button>`;}
function choices(type,selected,filter){const list=alive().filter(filter||(()=>true));return `<div class="grid">${list.map(p=>`<button class="choice ${String(selected)===String(p.id)?"selected":""}" onclick="choose('${type}','${p.id}')">${esc(p.name)}<small>${ROLES[p.role]?.icon||""} Rolle geheim</small></button>`).join("")}</div>`;}
function thiefStep(){return `<div class="notice">🃏 Der Dieb ist aktiv. Prüfe eure Hausregel für die Karten und führe sie außerhalb der App aus.</div>${nextButton(false)}`;}
function cupidStep(){return choices("lover",null)+`<div class="notice">Ausgewählt: <b>${S.lovers.length}/2</b></div>${nextButton(S.lovers.length!==2)}`;}
function wolfStep(){return choices("victim",S.victim)+nextButton(!S.victim);}
function seerStep(){return choices("seer",S.seerTarget)+nextButton(!S.seerTarget);}
function witchStep(){
if(!S.healDecision){
 return `<div class="notice">🐺 Opfer der Werwölfe: <b>${S.victim?esc(player(S.victim).name):"niemand"}</b></div>
 <div class="grid">
 <button class="choice" onclick="chooseHealDecision('yes')" ${S.healUsed||!S.victim?"disabled":""}>💚 Retten<small>${S.healUsed?"bereits benutzt":"Rettungstrank 1× pro Spiel"}</small></button>
 <button class="choice" onclick="chooseHealDecision('no')">🚫 Nicht retten<small>Das Opfer sterben lassen</small></button>
 </div>`;
}
return `<div class="notice">${S.healDecision==="yes"?"💚 Die Hexe hat das Opfer gerettet.":"☠️ Das Werwolf-Opfer wird nicht gerettet."}</div>
<div class="notice">☠️ Möchte die Hexe jetzt jemanden töten?</div>
<div class="grid">
<button class="choice ${S.poisonDecision==="yes"?"selected":""}" onclick="choosePoisonDecision('yes')" ${S.poisonUsed?"disabled":""}>☠️ Ja, töten<small>${S.poisonUsed?"Todestrank bereits benutzt":"Eine Person auswählen"}</small></button>
<button class="choice ${S.poisonDecision==="no"?"selected":""}" onclick="choosePoisonDecision('no')" ${S.poisonUsed?"disabled":""}>🚫 Nein<small>Keinen Todestrank verwenden</small></button>
</div>
${S.poisonDecision==="yes"&&!S.poisonUsed?choices("poison",S.poisonTarget):""}
<button class="btn next" onclick="finishWitch()" ${S.poisonDecision==="yes"&&!S.poisonTarget?"disabled":""}>Weiter →</button>`;}

function hunterStep(){return `<div class="notice">🏹 Der Jäger ist gestorben. Wähle einen lebenden Spieler, den er mitnimmt.</div>${choices("hunter",S.hunterTarget)}${nextButton(!S.hunterTarget)}`;}

function choose(type,id){
if(type==="victim")S.victim=id;
if(type==="seer"){S.seerTarget=id;alert("🔮 "+player(id).name+" ist "+ROLES[player(id).role].name+".");}
if(type==="poison"&&!S.poisonUsed){S.poisonTarget=id;S.poisonDecision="yes";}
if(type==="hunter")S.hunterTarget=id;
if(type==="lover"){if(S.lovers.includes(id))S.lovers=S.lovers.filter(x=>String(x)!==String(id));else if(S.lovers.length<2)S.lovers.push(id);}
if(type==="dayVote")S.dayVote=id;
save();render();
}
function chooseHealDecision(value){
if(value==="yes"&&S.healUsed)return;
S.healDecision=value;
if(value==="yes"&&S.victim){S.healUsed=true;S.victim=null;}
if(value==="no"&&S.victim===null)S.victim=null;
save();render();
}
function choosePoisonDecision(value){
if(S.poisonUsed)return;
S.poisonDecision=value;
if(value==="no")S.poisonTarget=null;
save();render();
}
function healVictim(){chooseHealDecision("yes");}
function poisonSelected(){choosePoisonDecision("yes");}

function nextPhase(){
if(S.phase==="hunter"){finishHunter();return;}
const q=sequence();const i=q.indexOf(S.phase);
if(S.phase==="cupid"&&S.lovers.length!==2)return;
if(S.phase==="wolf"&&!S.victim)return;
if(S.phase==="seer"&&!S.seerTarget)return;
S.phase=q[i+1];if(!S.phase)finishWitch();else{save();render();}
}
function finishWitch(){
if(S.healDecision==="yes")S.victim=null;
if(S.poisonDecision!=="yes")S.poisonTarget=null;
resolveDeaths();
}
function resolveDeaths(){
let dead=[];if(S.victim&&!S.healUsed)dead.push(S.victim);if(S.poisonTarget&&!dead.includes(S.poisonTarget))dead.push(S.poisonTarget);
let changed=true;while(changed){changed=false;for(const id of [...dead]){if(S.lovers.includes(id)){const other=S.lovers.find(x=>String(x)!==String(id));if(other&&!dead.includes(other)){dead.push(other);changed=true;}}}}
dead.forEach(id=>{const p=player(id);if(p&&p.alive){p.alive=false;S.log.push(p.name+" ist gestorben.");}});
const hunter=dead.find(id=>player(id)?.role==="hunter");
if(hunter){S.screen="play";S.phase="hunter";S.hunterTarget=null;save();render();return;}
S.screen="morning";S.phase=null;save();render();
}
function finishHunter(){
if(!S.hunterTarget)return;const target=player(S.hunterTarget);if(target&&target.alive){target.alive=false;S.log.push(target.name+" wurde vom Jäger mitgenommen.");}
if(S.lovers.includes(S.hunterTarget)){const other=S.lovers.find(x=>String(x)!==String(S.hunterTarget));const p=player(other);if(p&&p.alive){p.alive=false;S.log.push(p.name+" ist als Liebende/r ebenfalls gestorben.");}}
S.hunterTarget=null;S.screen="morning";S.phase=null;save();render();
}
function renderMorning(app){
const dead=S.players.filter(p=>!p.alive);
app.innerHTML=header()+`<section class="hero morning"><div class="eyebrow">☀️ Morgen</div><h1>Der Morgen graut.</h1><p class="muted">${dead.length?dead.length+" Spieler sind bisher tot.":"Niemand ist gestorben. Verdächtig ruhig."}</p></section>
<section class="card"><h2>💀 Tote Spieler</h2>${dead.length?dead.map(p=>`<div class="death"><strong>${esc(p.name)}</strong><span>${ROLES[p.role]?.icon||""}</span></div>`).join(""):"<div class='empty muted'>Niemand ist diese Nacht gestorben.</div>"}</section>
<section class="card"><h2>🗳️ Dorfabstimmung</h2><p class="muted">Das Dorf entscheidet jetzt, wer am Tag sterben soll. Wähle den Spieler, der die meisten Stimmen bekommen hat, oder niemanden.</p>
${choices("dayVote",S.dayVote)}
<button class="btn" onclick="chooseDayNobody()">🚫 Niemanden töten</button>
<button class="btn primary" onclick="finishDayVote()" ${S.dayVote||S.dayVote==="none"?"":"disabled"}>🗳️ Abstimmung auswerten</button></section>
<section class="card"><h2>📜 Protokoll</h2>${S.log.length?S.log.slice(-10).map(x=>`<p class="muted">• ${esc(x)}</p>`).join(""):"<p class='muted'>Noch keine Ereignisse.</p>"}</section>`;
}
function nextNight(){
S.night++;S.victim=null;S.seerTarget=null;S.poisonTarget=null;S.healDecision=null;S.poisonDecision=null;S.dayVote=null;S.lovers=[];S.hunterTarget=null;
S.screen="play";S.phase=sequence()[0]||"wolf";save();render();
}
function chooseDayNobody(){S.dayVote="none";save();render();}
function finishDayVote(){
if(!S.dayVote)return;
if(S.dayVote!=="none"){
 const p=player(S.dayVote);
 if(p&&p.alive){p.alive=false;S.log.push(p.name+" wurde vom Dorf hingerichtet.");}
 const hunter=p&&p.role==="hunter";
 if(hunter){S.screen="play";S.phase="hunter";S.hunterTarget=null;S.dayVote=null;save();render();return;}
 if(p&&S.lovers.includes(p.id)){
  const other=S.lovers.find(x=>String(x)!==String(p.id));const lp=player(other);
  if(lp&&lp.alive){lp.alive=false;S.log.push(lp.name+" ist als Liebende/r ebenfalls gestorben.");}
 }
}
S.dayVote=null;
S.screen="morning";
S.phase=null;
save();renderDayResult();
}
function renderDayResult(){
 const app=document.getElementById("app");
 const dead=S.players.filter(p=>!p.alive);
 app.innerHTML=header()+`<section class="hero morning"><div class="eyebrow">🗳️ Abstimmung beendet</div><h1>${S.log[S.log.length-1]||"Das Dorf hat niemanden getötet."}</h1><p class="muted">Die Nacht kann beginnen.</p></section>
 <section class="card"><h2>💀 Tote Spieler</h2>${dead.length?dead.map(p=>`<div class="death"><strong>${esc(p.name)}</strong><span>${ROLES[p.role]?.icon||""}</span></div>`).join(""):"<div class='empty muted'>Niemand ist tot.</div>"}</section>
 <button class="btn primary" onclick="nextNight()">🌙 Nacht ${S.night+1} starten</button>`;
}

try{render();}catch(e){document.getElementById("app").innerHTML='<section class="hero"><div class="eyebrow">Fehler</div><h1>Der Erzähler konnte nicht starten.</h1><p class="muted">Bitte die Seite einmal neu laden.</p></section>';console.error(e);}
</script>
</body>
</html>
